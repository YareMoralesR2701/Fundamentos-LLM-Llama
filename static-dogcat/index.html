<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Visual: Lenguaje Corporal de Perros y Gatos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Guía Visual: Cómo Interpretar el Lenguaje Corporal de Perros y Gatos</h1>
    </header>
    <main>
        <section class="container">
            <div class="column perro">
                <h2>Señales Corporales del Perro</h2>
                <input type="text" id="buscador-perro" placeholder="Buscar Señal Canina...">
                <div id="lista-perro" class="lista-senales"></div>
            </div>
            <div class="column gato">
                <h2>Señales Corporales del Gato</h2>
                <input type="text" id="buscador-gato" placeholder="Buscar Señal Felina...">
                <div id="lista-gato" class="lista-senales"></div>
            </div>
        </section>
    </main>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
